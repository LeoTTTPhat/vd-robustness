study_extension:
  purpose: "Journal-scale detector and dataset expansion for IST submission readiness."
  status: "configured_and_partially_conducted_low_compute_dataset_preparation"
  requested_detectors:
    - name: "LineVul"
      family: "transformer_line_level"
      role: "Credible line-level vulnerability detector; evaluate function-level prediction and optional line localization stability."
      source: "awsm-research/LineVul"
      execution_mode: "external_repo_or_local_checkpoint"
      compute_profile: "moderate; inference feasible on CPU/GPU subset, retraining not recommended on laptop"
      local_status: "manifested; not executed because no LineVul checkpoint is present locally"
    - name: "VulBERTa"
      family: "roberta_vulnerability_detector"
      role: "Transformer detector trained/pretrained for source-code vulnerability detection."
      source: "claudios/VulBERTa-mlm and claudios/VulBERTa-MLP-ReVeal"
      execution_mode: "huggingface_checkpoint_if_transformers_torch_available"
      compute_profile: "low-to-moderate for inference; moderate for fine-tuning"
      local_status: "manifested; runner support added as optional dependency path"
    - name: "CodeBERT fine-tuned on Devign"
      family: "codebert_sequence_classifier"
      role: "Pretrained code representation with Devign/CodeXGLUE defect-detection fine-tuning."
      source: "microsoft/codebert-base plus Devign fine-tuning, or a public CodeBERT vulnerability checkpoint"
      execution_mode: "huggingface_checkpoint_or_local_finetune"
      compute_profile: "low-to-moderate for inference; moderate for fine-tuning"
      local_status: "manifested; use as minimum credible transformer baseline"
    - name: "ReVeal"
      family: "graph_based_vulnerability_detector"
      role: "Graph-based vulnerability detector for representation diversity."
      source: "original ReVeal implementation or empirical-study replication package"
      execution_mode: "external_repo_with_graph_preprocessing"
      compute_profile: "moderate-to-high because graph extraction is the bottleneck"
      local_status: "manifested; not executed in low-compute path"
    - name: "ReGVD"
      family: "gnn_vulnerability_detector"
      role: "Graph neural vulnerability detector alternative to ReVeal."
      source: "daiquocnguyen/GNN-ReGVD"
      execution_mode: "external_repo_with_dependency_installation"
      compute_profile: "moderate; smaller than full ReVeal if preprocessing is reused"
      local_status: "manifested; not executed in low-compute path"

datasets:
  completed_local_samples:
    - name: "Big-Vul"
      minimum_rows: 3000
      normalized_file: "data/raw/bigvul.jsonl"
      summary_file: "data/processed/bigvul_summary.json"
      source: "bstee615/bigvul via Hugging Face dataset rows API"
    - name: "DiverseVul"
      preferred_rows: 5000
      normalized_file: "data/raw/diversevul.jsonl"
      summary_file: "data/processed/diversevul_summary.json"
      source: "bstee615/diversevul via Hugging Face dataset rows API"
  transformed_samples:
    - name: "Big-Vul"
      transformed_file: "data/processed/bigvul_transformed.jsonl"
      summary_file: "data/processed/bigvul_transform_summary.json"
    - name: "DiverseVul"
      transformed_file: "data/processed/diversevul_transformed.jsonl"
      summary_file: "data/processed/diversevul_transform_summary.json"

minimum_submission_gate:
  must_have_before_claiming_final_results:
    - "Run at least one credible transformer detector, preferably CodeBERT fine-tuned on Devign or VulBERTa, on CodeXGLUE/Devign, Big-Vul, and DiverseVul transformed sets."
    - "Run one line-level detector or graph detector, preferably LineVul or ReGVD, on at least CodeXGLUE/Devign and Big-Vul."
    - "Report detector-specific tokenizer truncation and unavailable-checkpoint exclusions."
    - "Keep lightweight detectors framed only as pipeline sanity checks."
